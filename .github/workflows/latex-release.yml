name: Build PDF (push) + Release (tag)

on:
  push:
    branches: ['**']
    tags: ['*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dateinamen je nach Event-Typ festlegen
      - name: Compute names
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            BASENAME="climatereport-${GITHUB_REF_NAME}"
          else
            SHORTSHA="${GITHUB_SHA::7}"
            BASENAME="climatereport-test-${GITHUB_REF_NAME}-${SHORTSHA}"
          fi
          echo "base_name=${BASENAME}" >> "$GITHUB_OUTPUT"
          echo "pdf_name=${BASENAME}.pdf" >> "$GITHUB_OUTPUT"
          echo "pdf_path=de_translation/${BASENAME}.pdf" >> "$GITHUB_OUTPUT"

      # gitversion.tex erzeugen
      - name: Write git tag/branch into TeX macro
        run: |
          mkdir -p de_translation
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "\\def\\gitversion{${GITHUB_REF_NAME}}" > de_translation/gitversion.tex
          else
            SHORTSHA="${GITHUB_SHA::7}"
            echo "\\def\\gitversion{${GITHUB_REF_NAME}-test-${SHORTSHA}}" > de_translation/gitversion.tex
          fi
          echo "Created de_translation/gitversion.tex:"
          cat de_translation/gitversion.tex

      # Debug: Prüfe, ob die .tex-Datei wirklich da ist
      - name: Debug paths
        run: |
          pwd
          ls -la
          ls -la de_translation || true

      # LaTeX Build im Unterordner
      - name: Compile LaTeX (TeX Live 2025)
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: de_translation
          root_file: climatereport.tex
          texlive_version: 2025
          args: >
            -file-line-error
            -halt-on-error
            -interaction=nonstopmode
            -jobname=${{ steps.meta.outputs.base_name }}

      # Artefakt hochladen
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.base_name }}
          path: de_translation/${{ steps.meta.outputs.base_name }}.pdf
          if-no-files-found: error
          retention-days: 7

      # Bei Tags: Release mit PDF
      - name: Create GitHub Release & upload PDF
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            de_translation/${{ steps.meta.outputs.base_name }}.pdf